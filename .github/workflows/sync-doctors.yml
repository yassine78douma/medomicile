name: Sync doctors from Google Sheet

on:
  workflow_dispatch:
    inputs:
      allow_doctor_drop:
        description: "Autoriser une baisse de 50% ou plus du nombre de médecins"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  sync-doctors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync doctors JSON
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_RANGE: ${{ vars.GOOGLE_SHEET_RANGE || 'Médecins!A:Z' }}
          ALLOW_DOCTOR_DROP: ${{ github.event.inputs.allow_doctor_drop || 'false' }}
        run: node scripts/sync-doctors.mjs

      - name: Validate JSON
        run: node -e "const f=require('fs'); const data=JSON.parse(f.readFileSync('data/doctors.json','utf8')); if(!Array.isArray(data.doctors)) throw new Error('data/doctors.json must contain doctors array');"

      - name: Commit and push changes
        run: |
          if git diff --quiet -- data/doctors.json; then
            echo "No doctors data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doctors.json
          git commit -m "chore: update doctors directory"
          git push
