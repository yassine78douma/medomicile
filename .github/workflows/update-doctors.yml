name: Update doctors from workbook

on:
  push:
    paths:
      - "médecin spécialiste kenitra.xlsx"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-doctors
  cancel-in-progress: false

jobs:
  update-doctors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate doctor data and reports
        run: python3 scripts/sync-doctors.py

      - name: Validate generated JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("doctors.json", "doctors-duplicates.json", "doctors-report.json"):
              json.loads(Path("data", name).read_text(encoding="utf-8"))
          data = json.loads(Path("data/doctors.json").read_text(encoding="utf-8"))
          doctors = data["doctors"]
          assert doctors and all(d["name"] and d["specialty"] and d["city"] for d in doctors)
          assert len({d["id"] for d in doctors}) == len(doctors)
          print(f"Validated {len(doctors)} doctors")
          PY

      - name: Commit generated outputs
        run: |
          if git diff --quiet -- data/doctors.json data/doctors-duplicates.json data/doctors-report.json; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doctors.json data/doctors-duplicates.json data/doctors-report.json
          git commit -m "chore: update doctors directory [skip ci]"
          git push
