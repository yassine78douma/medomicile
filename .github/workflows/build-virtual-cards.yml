name: Build virtual cards from canonical sources
on:
  workflow_dispatch:
  push:
    paths:
      - data/doctors.json
      - data/establishments.json
      - data/dialysis-centers.json
      - data/radiology-centers.json
      - data/laboratoires-kenitra.json
      - data/pharmacies-kenitra.json
      - scripts/*cards*
      - scripts/build-card-directories.py
      - .github/workflows/build-virtual-cards.yml
permissions:
  contents: write
concurrency:
  group: update-doctors
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/cards-requirements.txt
      - run: python scripts/build-virtual-cards.py
      - run: python scripts/test-virtual-cards.py
      - name: Commit generated artifacts
        run: |
          git add p e contacts assets/cards data/virtual-card-index.json data/virtual-card-report.json data/card-directory-report.json sitemap-cards.xml script.js '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rebuild virtual cards [skip ci]'
          # The doctor/pharmacy workflows can update main while this build is running.
          # Rebase the generated commit before pushing instead of failing with exit 128.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt ${attempt} failed; retrying after remote refresh."
            sleep 2
          done
          echo "Unable to publish generated artifacts after 3 attempts."
          exit 1
