name: Medomicile Social Publisher
on:
  workflow_dispatch:
    inputs:
      article: {description: Article slug or HTML path, required: true, default: brulures-premiers-gestes.html}
      publish: {description: Publish after approval and connection, required: true, default: 'false'}
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install Pillow
      - run: python scripts/generate-social.py "${{ inputs.article }}"
      - run: python scripts/test-social.py
      - if: ${{ inputs.publish == 'true' }}
        run: python scripts/publish-social.py "${{ inputs.article }}"
